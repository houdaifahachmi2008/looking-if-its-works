<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sitevo Intro</title>
<style>
@font-face{font-family:"Inter";src:url("fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"JBM";src:url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");font-weight:400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#000;
  perspective:2200px;perspective-origin:960px 540px;font-family:Inter,sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.abs{position:absolute;left:0;top:0}
#amb{position:absolute;inset:0;pointer-events:none}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:960px 540px}
#bggrid{position:absolute;left:-1040px;top:-660px;width:4000px;height:2400px;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:96px 96px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(ellipse 36% 38% at 50% 50%,#000 10%,transparent 100%);mask-image:radial-gradient(ellipse 36% 38% at 50% 50%,#000 10%,transparent 100%)}
#gdot{position:absolute;left:960px;top:540px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,160,255,.95) 0,rgba(61,123,255,.55) 3%,rgba(61,123,255,.16) 14%,rgba(61,123,255,.04) 34%,rgba(61,123,255,0) 60%)}
#desk{position:absolute;left:180px;top:111px;width:1560px;height:858px;transform-style:preserve-3d;transform-origin:780px 429px}

/* ---------- shell (notification -> chat -> browser frame) */
#shell{position:absolute;left:0;top:0;border-radius:30px}
#shell .shbg{position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.1)}
.notif{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;white-space:nowrap}
.notif .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#5a8dff,#2350d8);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(40,90,255,.35)}
.notif .tx{font-size:15px;font-weight:600;letter-spacing:.22em;margin-right:-.22em;color:#f3f5f9}
.hdr{position:absolute;left:0;top:0;right:0}
.dots{position:absolute;left:22px;display:flex;gap:8px}
.dots i{width:11px;height:11px;border-radius:50%;background:#262930;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.hline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07)}
.url{position:absolute;left:50%;width:400px;height:26px;margin-left:-200px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}

/* ---------- chat elements */
.lbl{position:absolute;left:0;top:0;font-size:13px;font-weight:600;letter-spacing:.18em;color:#6d7484;white-space:nowrap;line-height:1}
.bub{position:absolute;left:0;top:0}
.bub>i{position:absolute;inset:0;border-radius:inherit}
.bA-c{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 36px rgba(0,0,0,.5),0 0 32px rgba(61,123,255,.08)}
.bA-s{background:linear-gradient(180deg,rgba(61,123,255,.22),rgba(61,123,255,.12));border:1px solid rgba(120,160,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 36px rgba(0,0,0,.5),0 0 34px rgba(61,123,255,.13)}
.bB{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),rgba(10,11,15,.72);border:1px solid rgba(255,255,255,.08)}
.txt{position:absolute;left:0;top:0;white-space:nowrap;font-size:25px;line-height:1.36;font-weight:450;color:#eef1f6;letter-spacing:-.01em}
.typ{position:absolute;left:0;top:0;width:78px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:7px}
.typ b{width:8px;height:8px;border-radius:50%;background:#a2a9b8}
#btn{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap}
#btn .bg{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#11141c,#07080c);border:1px solid rgba(91,140,255,.5);overflow:hidden}
#btn .sheen{position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(90deg,rgba(140,175,255,0),rgba(140,175,255,.16),rgba(140,175,255,0))}
#btn .flash{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at center,rgba(150,185,255,.35),rgba(150,185,255,0) 70%);opacity:0}
#btn span{position:relative;display:flex;align-items:center;gap:14px}
#ring{position:absolute;left:0;top:0;border-radius:999px;border:1px solid rgba(110,155,255,.7)}
.arr{display:block}

/* ---------- website template (container-query driven, one source for every screen) */
.site{position:absolute;left:0;top:0;container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;font-family:Inter,sans-serif;color:#fff;transform-origin:0 0}
.s-bg{position:absolute;inset:0;overflow:hidden}
.s-haze{position:absolute;inset:0;background:radial-gradient(ellipse 55% 48% at 50% 0%,rgba(61,123,255,.11),rgba(61,123,255,0) 70%)}
.s-horizon{position:absolute;left:50%;top:calc(100% - 12.5cqw);width:170cqw;height:170cqw;margin-left:-85cqw;border-radius:50%;
  background:#030407;border-top:1px solid rgba(140,175,255,.6);
  box-shadow:0 -1px 22px rgba(61,123,255,.38),0 -40px 140px rgba(61,123,255,.14),inset 0 26px 70px -34px rgba(91,140,255,.4)}
.s-nav{position:relative;flex:none;height:calc(40px + 1.8cqw);display:flex;align-items:center;padding:0 calc(24px + 3.6cqw);z-index:2}
.s-logo{display:flex;align-items:center;gap:11px}
.mk{display:block;width:26px;height:26px}
.mk svg{display:block}
.s-word{font-size:16px;font-weight:600;letter-spacing:.26em;line-height:1;margin-right:-.26em;white-space:nowrap}
.s-links{position:absolute;right:calc(24px + 3.6cqw);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:38px;font-size:15px;font-weight:450;color:#9198a6;white-space:nowrap}
.s-links span{display:inline-block}
.s-links .s-contact{color:#fff;padding:9px 18px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.03)}
.s-burger{position:absolute;right:calc(24px + 3.6cqw);top:50%;width:22px;height:11px;margin-top:-5.5px;opacity:0}
.s-burger i{position:absolute;left:0;right:0;height:1.6px;background:#fff;border-radius:2px}
.s-burger i:first-child{top:0}.s-burger i:last-child{bottom:0}
.s-navline{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.09) 18%,rgba(255,255,255,.09) 82%,rgba(255,255,255,0))}
.s-hero{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 calc(16px + 3cqw);z-index:1}
.s-h1{position:relative;width:100%;font-size:calc(30px + 5.77cqw);line-height:.96;font-weight:700;letter-spacing:-.045em}
.ln{display:block;overflow:hidden;padding:.03em 0 .07em}
.w{display:inline-block;background:linear-gradient(180deg,#fff 38%,#aab3c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .05em;white-space:nowrap}
.gA{display:block}
.gB{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:block}
.s-subwrap{position:relative;margin-top:calc(14px + .9cqw);width:100%}
.s-sub{font-size:calc(15px + .45cqw);line-height:1.4;color:#8e96a5;font-weight:420;letter-spacing:-.005em}
.sB{position:absolute;left:0;right:0;top:0;color:#cdd3de}
.s-cta{margin-top:calc(20px + 1cqw);height:calc(44px + .9cqw);padding:0 calc(22px + .5cqw);display:inline-flex;align-items:center;gap:12px;border-radius:999px;
  background:linear-gradient(180deg,#fff,#e4e8f0);color:#06070a;font-size:calc(12px + .2cqw);font-weight:600;letter-spacing:.14em;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(255,255,255,.25),0 14px 44px -10px rgba(61,123,255,.45)}
.s-cards{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(10px + .9cqw);margin:0 calc(24px + 3.6cqw) calc(18px + 1cqw);z-index:1}
@container (max-width:700px){.s-cards{grid-template-columns:1fr}}
.s-card{position:relative;height:calc(70px + 3.85cqw);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),rgba(10,11,15,.72);
  border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;justify-content:center}
.s-card .vg{height:56%;display:block}
.s-card .vg svg{height:100%;width:auto;display:block;overflow:visible}
.s-beam{position:absolute;left:0;right:0;height:1px;pointer-events:none;z-index:3}
.s-beam i{position:absolute;top:0;height:1px;width:38%;background:linear-gradient(90deg,rgba(91,140,255,0),rgba(140,175,255,.95) 50%,rgba(91,140,255,0));box-shadow:0 0 14px rgba(61,123,255,.7)}
.s-beam b{position:absolute;top:0;left:50%;height:1px;width:140px;margin-left:-70px;background:linear-gradient(90deg,rgba(91,140,255,0),rgba(120,160,255,.9),rgba(91,140,255,0))}

/* ---------- build layers (exploded view) */
.sheet{position:absolute;border-radius:16px}
.col{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(61,123,255,.05),rgba(61,123,255,.025));border-left:1px solid rgba(91,140,255,.12);border-right:1px solid rgba(91,140,255,.12)}
.ol{position:absolute;border:1px solid rgba(110,155,255,.7)}
.ol .h{position:absolute;width:9px;height:9px;background:#0a0c12;border:1px solid rgba(150,185,255,.95)}
pre.code{font-family:JBM,monospace;font-size:24px;line-height:1.75;color:#6d768a;white-space:pre}
.code .t{color:#93b4ff}.code .a{color:#b4bccd}.code .s{color:#dde3f0}.code .p{color:#8a93a6}
.llab{position:absolute;white-space:nowrap;font-size:30px;font-weight:600;letter-spacing:.24em;color:#dfe5ef;display:flex;align-items:center;gap:16px;line-height:1}
.llab::before{content:"";width:10px;height:10px;border-radius:50%;background:#4f86ff;box-shadow:0 0 12px rgba(61,123,255,.9)}
.wgt{width:520px;height:720px}
.wgt .llab{font-size:21px;gap:12px;top:0!important;left:2px!important}
.wgt>.wcard,.wgt>.dev{top:46px!important}
.wgt .llab::before{width:8px;height:8px}
.wcard{position:absolute;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(9,10,14,.88);border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.bar{position:absolute;height:8px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#3d7bff,#9fbcff)}

/* ---------- devices */
.dev{position:absolute;left:0;top:0;background:#050506;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.8),0 30px 80px rgba(0,0,0,.6)}
.dev .scr{position:absolute;overflow:hidden;background:#050608}
.island{position:absolute;left:50%;width:44px;height:12px;margin-left:-22px;border-radius:7px;background:#000;z-index:5}
.dlab{position:absolute;left:0;top:0;font-size:14px;font-weight:600;letter-spacing:.32em;color:#8c94a4;white-space:nowrap;line-height:1}

/* ---------- overlays */
#cursor{position:absolute;left:0;top:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
#fade{position:absolute;inset:0;background:#010102;pointer-events:none}
#fglow{position:absolute;left:960px;top:540px;width:1400px;height:700px;margin:-350px 0 0 -700px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,123,255,.2),rgba(61,123,255,.06) 45%,rgba(61,123,255,0))}
#fLogo{position:absolute;left:0;top:0;display:flex;align-items:center;gap:11px;transform-origin:0 0}
#tag{position:absolute;left:0;right:0;top:0;text-align:center;font-size:25px;font-weight:420;color:#98a0af;letter-spacing:-.005em}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="amb"></div>
  <div id="world">
    <div id="bggrid"></div>
    <div id="gdot"></div>
    <div id="desk">
      <div id="shell">
        <div class="shbg"></div>
        <div class="hdr"><div class="dots"><i></i><i></i><i></i></div><div class="url"></div><div class="hline"></div></div>
        <div class="notif"><div class="ic"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2.2c3.9 0 7 2.6 7 5.9s-3.1 5.9-7 5.9c-.8 0-1.6-.1-2.3-.3L3 15.2l.9-3C2.7 11.1 2 9.7 2 8.1 2 4.8 5.1 2.2 9 2.2z" fill="#fff"/></svg></div><div class="tx">NEW MESSAGE</div></div>
      </div>
      <div id="lyrC" class="sheet"></div>
      <div id="lyrD" class="sheet"></div>
      <div id="siteDWrap"></div>
      <!-- chat / morph elements -->
      <div id="lblC" class="lbl">CLIENT</div>
      <div id="lblS" class="lbl">SITEVO</div>
      <div id="hMark" class="abs"></div>
      <div id="bubC" class="bub"><i class="bA-c"></i><i class="bB"></i></div>
      <div id="bubS1" class="bub"><i class="bA-s"></i><i class="bB"></i></div>
      <div id="bubS2" class="bub"><i class="bA-s"></i><i class="bB"></i></div>
      <div id="typC" class="typ bA-c"><b></b><b></b><b></b></div>
      <div id="typS" class="typ bA-s"><b></b><b></b><b></b></div>
      <div id="txtC" class="txt">Kunnen jullie een website maken<br>voor mijn bedrijf?</div>
      <div id="txtS1" class="txt">Natuurlijk.</div>
      <div id="txtS2" class="txt">Laten we beginnen.</div>
      <div id="ring"></div>
      <div id="btn"><div class="bg"><div class="sheen"></div></div><div class="flash"></div><span id="btnTx">BUILD WEBSITE <i class="arrw"></i></span></div>
    </div>
    <div id="lyrP" class="abs wgt"></div>
    <div id="wSeo" class="abs wgt"></div>
    <div id="wPerf" class="abs wgt"></div>
    <div id="wLaunch" class="abs wgt"></div>
    <div id="devT" class="dev"><div class="scr" id="scrT"></div></div>
    <div id="devM" class="dev"><div class="scr" id="scrM"></div><div class="island"></div></div>
    <div id="labD" class="dlab">DESKTOP</div>
    <div id="labT" class="dlab">TABLET</div>
    <div id="labM" class="dlab">MOBILE</div>
  </div>
  <div id="cursor"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M7 4v21l5.4-5.2 3.5 8 3.6-1.6-3.5-7.8h7.6z" fill="#fff" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
  <div id="fade"></div>
  <div id="fglow"></div>
  <div id="fLogo"></div>
  <div id="tag">Websites that make people stop scrolling.</div>
  <div id="vig"></div>
</div>

<script>
'use strict';
/* ================================================================ assets */
const MARK = `<span class="mk"><svg width="26" height="26" viewBox="0 0 26 26"><defs><linearGradient id="mkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f29"/><stop offset="1" stop-color="#0b0d12"/></linearGradient></defs><rect x=".5" y=".5" width="25" height="25" rx="7.5" fill="url(#mkg)" stroke="rgba(255,255,255,.16)"/><rect x="9" y="7.6" width="10.4" height="4" rx="2" fill="#fff"/><rect x="6.6" y="14.4" width="10.4" height="4" rx="2" fill="#4f86ff"/></svg></span>`;
const ARROW = `<svg class="arr" width="17" height="17" viewBox="0 0 16 16"><path d="M2.2 8h11.2M9.2 3.6 13.6 8l-4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const VG = [
  // design: bezier with handles
  `<svg viewBox="0 0 220 80"><path class="dr" d="M18 62 C 70 6, 150 6, 202 46" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="2"/>
   <path class="dr" d="M70 6 L18 62 M150 6 L202 46" fill="none" stroke="rgba(110,155,255,.55)" stroke-width="1.2"/>
   <rect x="13" y="57" width="10" height="10" fill="#0a0c12" stroke="#7fa6ff" stroke-width="1.5"/><rect x="197" y="41" width="10" height="10" fill="#0a0c12" stroke="#7fa6ff" stroke-width="1.5"/>
   <circle cx="70" cy="6" r="4" fill="#4f86ff"/><circle cx="150" cy="6" r="4" fill="#4f86ff"/></svg>`,
  // code: brackets + lines
  `<svg viewBox="0 0 220 80"><path class="dr" d="M30 22 14 40l16 18M70 22l16 18-16 18M58 16 42 64" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
   <rect x="110" y="20" width="70" height="6" rx="3" fill="#4f86ff"/><rect x="110" y="37" width="96" height="6" rx="3" fill="rgba(255,255,255,.28)"/><rect x="124" y="54" width="54" height="6" rx="3" fill="rgba(255,255,255,.18)"/></svg>`,
  // responsive: three screens
  `<svg viewBox="0 0 220 80"><rect class="dr" x="20" y="8" width="120" height="70" rx="6" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="2"/>
   <rect class="dr" x="122" y="22" width="48" height="58" rx="5" fill="#0b0d12" stroke="rgba(255,255,255,.62)" stroke-width="2"/>
   <rect class="dr" x="162" y="34" width="28" height="46" rx="5" fill="#0b0d12" stroke="#7fa6ff" stroke-width="2"/></svg>`
];
function siteHTML(id, final){
  return `<div class="site" id="${id}">
  <div class="s-bg"><div class="s-haze"></div><div class="s-horizon"></div></div>
  <header class="s-nav">
    <div class="s-logo">${MARK}<span class="s-word">SITEVO</span></div>
    <nav class="s-links"><span>Work</span><span>Services</span><span>Process</span><span class="s-contact">Contact</span></nav>
    <div class="s-burger"><i></i><i></i></div>
    <div class="s-navline"></div>
  </header>
  <main class="s-hero">
    <h1 class="s-h1"><span class="gA"><span class="ln"><span class="w">WE BUILD</span></span><span class="ln"><span class="w">WEBSITES.</span></span></span>${final?`<span class="gB"><span class="ln"><span class="w">YOUR BUSINESS.</span></span><span class="ln"><span class="w">ONLINE.</span></span></span>`:''}</h1>
    <div class="s-subwrap"><p class="s-sub sA">Designed to make your business stand out.</p>${final?'<p class="s-sub sB">Built by Sitevo.</p>':''}</div>
    <div class="s-cta">START YOUR PROJECT ${ARROW}</div>
  </main>
  <section class="s-cards">${VG.map(v=>`<div class="s-card"><span class="vg">${v}</span></div>`).join('')}</section>
  ${final?'<div class="s-beam"><b></b><i></i></div>':''}
</div>`;
}

/* ================================================================ math */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  linear:t=>t,
  inCubic:t=>t*t*t,
  outCubic:t=>1-Math.pow(1-t,3),
  outQuart:t=>1-Math.pow(1-t,4),
  outQuint:t=>1-Math.pow(1-t,5),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  inOutQuart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  // critically-tuned spring: ~4% overshoot, settles by t=1
  spring:t=>{if(t<=0)return 0;if(t>=1)return 1;const z=.72,w=9,a=z*w,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-a*t)*(Math.cos(wd*t)+a/wd*Math.sin(wd*t));},
  springSoft:t=>{if(t<=0)return 0;if(t>=1)return 1;const z=.82,w=8,a=z*w,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-a*t)*(Math.cos(wd*t)+a/wd*Math.sin(wd*t));},
};

    S.devM.style.width=mw+'px'; S.devM.style.height=mh+'px'; S.devM.style.borderRadius='30px';
    setT(S.devM,`translate3d(${f2(mcx-mw/2)}px,${f2(mcy-mh/2)}px,${f2(lerp(-340,0,mIn)-200*out)}px) rotateY(${f2(lerp(0,-12,mIn)-18*out)}deg)`, mO*(1-out));

    const sm=q(S.devM,'.scr'); Object.assign(sm.style,{left:'7px',top:'7px',width:'156px',height:'338px',borderRadius:'24px'});

    const vw=lerp(1180,390,P(t,22.0,1.25,E.inOutCubic)); const scl=156/vw;
    layoutSite(M,vw,(338-15)/scl); siteM.style.top='15px'; siteM.style.transform=`scale(${f2(scl)})`;

    // labels
    const lab=(el,cx,t0)=>{const a=P(t,t0,.6);show(el,a>0&&out<1);setT(el,`translate3d(${f2(cx)}px,${f2(812+8*(1-a))}px,0) translateX(-50%)`, a*(1-out));el.style.marginRight='-.32em';};
    lab(S.labT,391,22.45); lab(S.labD,1005,22.55); lab(S.labM,1574,22.65);
  }
  respond(T,820); respond(P_,390);

  /* ---------- cursor (screen space) */
  {
    const a=P(t,7.45,.9,E.inOutCubic), ao=P(t,7.4,.3), out=P(t,8.95,.3);

  }

  /* ---------- scene 10: final brand moment */
  {
    const fd=P(t,27.0,.95,E.inOutSine);

    const lf=P(t,27.05,1.05,E.inOutCubic);

    const gl=P(t,28.45,.9,E.outCubic)*(1-.35*P(t,29.2,.8,E.inOutSine));
    S.fglow.style.opacity=f2(gl); S.fglow.style.transform=`scale(${f2(lerp(.6,1,P(t,28.45,1.4,E.outCubic)))})`;
  }
}

/* responsive state driven by virtual width (avoids discrete jumps) */
function respond(s, vw){
  const a=clamp((vw-760)/140);
  s.linksBox.style.opacity=f2(a); s.burger.style.opacity=f2(1-a);
  const nearBreak=1-clamp(Math.abs(vw-700)/90);
  qa(s.root,'.s-cards').forEach(c=>c.style.opacity=f2(1-nearBreak));
}

let CUR={x:1100,y:840}, LOGO={x:100,y:60,s:1,w0:140};

  render(26.99); const lr=D.logo.getBoundingClientRect(); const flr=S.fLogo; flr.style.transform='none';

const params=new URLSearchParams(location.search);
init().then(()=>{
